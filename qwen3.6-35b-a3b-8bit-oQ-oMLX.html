// --- TERRAIN HEIGHT LOOKUP ---
function getTerrainHeight(x, z) {
  const key = Math.round(x/50) + ',' + Math.round(z/50);
  if (terrainHeights[key] !== undefined) return terrainHeights[key];
  let y = 0;
  y += Math.sin(x * 0.005) * Math.cos(z * 0.005) * 40;
  y += Math.sin(x * 0.015 + 1) * Math.cos(z * 0.012 + 2) * 15;
  y += Math.sin(x * 0.04) * Math.cos(z * 0.035) * 5;
  const dx = x - 200, dz = z - 100;
  const dist = Math.sqrt(dx*dx + dz*dz);
  if (dist < 150) y += Math.max(0, (150 - dist) * 0.5);
  const dx2 = x + 300, dz2 = z + 200;
  const dist2 = Math.sqrt(dx2*dx2 + dz2*dz2);
  if (dist2 < 120) y += Math.max(0, (120 - dist2) * 0.4);
  terrainHeights[key] = y;
  return y;
}

function drawPlanePreview(cvs, type) {
  const ctx = cvs.getContext('2d');
  const w = cvs.width, h = cvs.height;
  ctx.clearRect(0, 0, w, h);
  ctx.fillStyle = 'rgba(20,20,50,0.5)';
  ctx.fillRect(0, 0, w, h);
  ctx.save();
  ctx.translate(w/2, h/2);
  if (type === 'fighter') {
    ctx.fillStyle = '#5577bb';
    ctx.beginPath(); ctx.moveTo(80,0); ctx.lineTo(-40,-12); ctx.lineTo(-60,-8); ctx.lineTo(-55,0); ctx.lineTo(-60,8); ctx.lineTo(-40,12); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#4466aa';
    ctx.beginPath(); ctx.moveTo(10,-8); ctx.lineTo(-20,-45); ctx.lineTo(-35,-45); ctx.lineTo(-30,-8); ctx.fill();
    ctx.beginPath(); ctx.moveTo(10,8); ctx.lineTo(-20,45); ctx.lineTo(-35,45); ctx.lineTo(-30,8); ctx.fill();
    ctx.fillStyle = '#3355aa';
    ctx.beginPath(); ctx.moveTo(-40,-5); ctx.lineTo(-55,-25); ctx.lineTo(-50,-25); ctx.lineTo(-42,-5); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-40,5); ctx.lineTo(-55,25); ctx.lineTo(-50,25); ctx.lineTo(-42,5); ctx.fill();
    ctx.fillStyle = '#88ccff';
    ctx.beginPath(); ctx.ellipse(25,0,12,5,0,0,Math.PI*2); ctx.fill();
  } else if (type === 'propeller') {
    ctx.fillStyle = '#99bb55';
    ctx.beginPath(); ctx.moveTo(70,0); ctx.lineTo(-30,-10); ctx.lineTo(-55,-5); ctx.lineTo(-50,0); ctx.lineTo(-55,5); ctx.lineTo(-30,10); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#88aa44';
    ctx.fillRect(-10,-3,20,6);
    ctx.beginPath(); ctx.moveTo(5,-3); ctx.lineTo(-15,-35); ctx.lineTo(-25,-35); ctx.lineTo(-15,-3); ctx.fill();
    ctx.beginPath(); ctx.moveTo(5,3); ctx.lineTo(-15,35); ctx.lineTo(-25,35); ctx.lineTo(-15,3); ctx.fill();
    ctx.fillStyle = '#779933';
    ctx.fillRect(-45,-2,12,4); ctx.fillRect(-48,-15,4,30);
    ctx.strokeStyle = '#ccc'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(75,0); ctx.lineTo(75,-12); ctx.moveTo(75,0); ctx.lineTo(75,12); ctx.stroke();
    ctx.fillStyle = '#88ccff';
    ctx.beginPath(); ctx.ellipse(30,0,8,4,0,0,Math.PI*2); ctx.fill();
  } else {
    ctx.fillStyle = '#556644';
    ctx.beginPath(); ctx.ellipse(0,0,40,12,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#445533';
    ctx.beginPath(); ctx.moveTo(40,0); ctx.lineTo(55,-6); ctx.lineTo(55,6); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-35,-5); ctx.lineTo(-70,-3); ctx.lineTo(-70,3); ctx.lineTo(-35,5); ctx.fill();
    ctx.strokeStyle = '#88aa66'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-70,-10); ctx.lineTo(-70,10); ctx.moveTo(-74,0); ctx.lineTo(-66,0); ctx.stroke();
    ctx.strokeStyle = '#aacc88'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-5,-35); ctx.lineTo(5,-35); ctx.moveTo(-5,35); ctx.lineTo(5,35); ctx.moveTo(-2,-35); ctx.lineTo(-2,35); ctx.moveTo(2,-35); ctx.lineTo(2,35); ctx.stroke();
    ctx.fillStyle = '#667755'; ctx.fillRect(-2,-12,4,12);
    ctx.fillStyle = '#88ccff';
    ctx.beginPath(); ctx.ellipse(35,-2,8,5,0.2,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#778866'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(-20,12); ctx.lineTo(-25,20); ctx.lineTo(20,20); ctx.lineTo(15,12); ctx.stroke();

// --- BUILD AIRCRAFT MODELS (large, visible scale) ---
function createFighterModel(mainColor, accentCol, tipColor) {
  const g = new THREE.Group();
  const bodyMat = new THREE.MeshPhongMaterial({ color: mainColor, flatShading: true });
  const wingMat = new THREE.MeshPhongMaterial({ color: accentCol, flatShading: true });
  const S = 0.4; // global scale factor

  // Fuselage - long cone (30 units long)
  const body = new THREE.Mesh(new THREE.ConeGeometry(12*S, 30*S, 8), bodyMat);
  body.rotation.x = Math.PI/2;
  body.castShadow = true;
  g.add(body);

  // Nose cone (8 units)
  const nose = new THREE.Mesh(new THREE.ConeGeometry(6*S, 8*S, 8), bodyMat);
  nose.rotation.x = -Math.PI/2;
  nose.position.z = 19*S;
  nose.castShadow = true;
  g.add(nose);

  // Wings (wingspan 25, depth 6)
  const wings = new THREE.Mesh(new THREE.BoxGeometry(6*S, 2.5*S, 25*S), wingMat);
  wings.position.set(0, -3*S, -3*S);
  wings.castShadow = true;
  g.add(wings);

  // Wing tip markers
  const tipMat = new THREE.MeshPhongMaterial({ color: tipColor });
  [-12.5, 12.5].forEach(x => {
    const tip = new THREE.Mesh(new THREE.BoxGeometry(5*S, 3*S, 8*S), tipMat);
    tip.position.set(x*S, -3*S, -3*S);
    g.add(tip);
  });

  // Tail wings
  const tail = new THREE.Mesh(new THREE.BoxGeometry(2.5*S, 2*S, 14*S), wingMat);
  tail.position.set(0, 0, -13*S);
  tail.castShadow = true;
  g.add(tail);

  // Vertical stabilizer
  const vStab = new THREE.Mesh(new THREE.BoxGeometry(2*S, 14*S, 12*S), wingMat);
  vStab.position.set(0, 7*S, -11*S);
  vStab.castShadow = true;
  g.add(vStab);

  // Cockpit (transparent dome)
  const cockpit = new THREE.Mesh(
    new THREE.SphereGeometry(7*S, 8, 6, 0, Math.PI*2, 0, Math.PI/2),
    new THREE.MeshPhongMaterial({ color: 0x88ddff, transparent: true, opacity: 0.7 })
  );
  cockpit.position.set(0, 8*S, 5*S);
  g.add(cockpit);

  // Engine glow
  const engine = new THREE.Mesh(
    new THREE.SphereGeometry(5*S, 6, 6),
    new THREE.MeshBasicMaterial({ color: 0x4488ff })
  );
  engine.position.z = -18*S;
  engine.name = 'engineGlow';
  g.add(engine);

  return g;
}

function createPropellerModel(mainColor, accentCol, tipColor) {
  const g = new THREE.Group();
  const bodyMat = new THREE.MeshPhongMaterial({ color: mainColor, flatShading: true });
  const wingMat = new THREE.MeshPhongMaterial({ color: accentCol, flatShading: true });
  const S = 0.4;

  // Fuselage (45 long, 10 wide)
  const body = new THREE.Mesh(new THREE.CylinderGeometry(5.5*S, 4.5*S, 45*S, 8), bodyMat);
  body.rotation.x = Math.PI/2;
  body.castShadow = true;
  g.add(body);

  // Nose
  const nose = new THREE.Mesh(new THREE.SphereGeometry(5.5*S, 8, 6, 0, Math.PI*2, 0, Math.PI/2), bodyMat);
  nose.rotation.x = -Math.PI/2;
  nose.position.z = 22*S;
  g.add(nose);

  // Propeller blades (35 units across)
  const propMat = new THREE.MeshPhongMaterial({ color: 0x888888 });
  const p1 = new THREE.Mesh(new THREE.BoxGeometry(1.5*S, 35*S, 2*S), propMat);
  p1.position.z = 25*S; p1.name = 'propeller';
  g.add(p1);
  const p2 = new THREE.Mesh(new THREE.BoxGeometry(35*S, 1.5*S, 2*S), propMat);
  p2.position.z = 25*S; p2.name = 'propeller';
  g.add(p2);

  // High wings
  const wings = new THREE.Mesh(new THREE.BoxGeometry(7*S, 2.5*S, 50*S), wingMat);
  wings.position.set(0, 12*S, 0);
  wings.castShadow = true;
  g.add(wings);

  // Tail wing
  const tail = new THREE.Mesh(new THREE.BoxGeometry(2*S, 2*S, 20*S), wingMat);
  tail.position.set(0, 0, -22*S);
  tail.castShadow = true;
  g.add(tail);

  // Vertical tail
  const vTail = new THREE.Mesh(new THREE.BoxGeometry(1.5*S, 14*S, 14*S), wingMat);
  vTail.position.set(0, 7*S, -20*S);
  vTail.castShadow = true;
  g.add(vTail);

  // Cockpit
  const cockpit = new THREE.Mesh(
    new THREE.SphereGeometry(6*S, 8, 6, 0, Math.PI*2, 0, Math.PI/2),
    new THREE.MeshPhongMaterial({ color: 0x99eeff, transparent: true, opacity: 0.6 })
  );
  cockpit.position.set(0, 10*S, 8*S);
  g.add(cockpit);

  return g;
}

function createHelicopterModel(mainColor, accentCol, tipColor) {
  const g = new THREE.Group();
  const bodyMat = new THREE.MeshPhongMaterial({ color: mainColor, flatShading: true });
  const S = 0.4;

  // Fuselage (50 long)
  const body = new THREE.Mesh(new THREE.CylinderGeometry(7*S, 6*S, 50*S, 8), bodyMat);
  body.rotation.x = Math.PI/2;
  body.castShadow = true;
  g.add(body);

  // Nose
  const nose = new THREE.Mesh(new THREE.ConeGeometry(7*S, 30*S, 8), bodyMat);
  nose.rotation.x = -Math.PI/2;
  nose.position.z = 40*S;
  g.add(nose);

  // Tail boom
  const tail = new THREE.Mesh(new THREE.CylinderGeometry(2.5*S, 7*S, 45*S, 6), bodyMat);
  tail.rotation.x = Math.PI/2;
  tail.position.z = -48*S;
  tail.castShadow = true;
  g.add(tail);

  // Tail rotor
  const tRotorMat = new THREE.MeshPhongMaterial({ color: 0x666666 });
  const tr1 = new THREE.Mesh(new THREE.BoxGeometry(16*S, 1*S, 1.5*S), tRotorMat);
  tr1.position.set(0, 0, -70*S); tr1.name = 'tailRotor';
  g.add(tr1);
  const tr2 = new THREE.Mesh(new THREE.BoxGeometry(1*S, 16*S, 1.5*S), tRotorMat);
  tr2.position.set(0, 0, -70*S); tr2.name = 'tailRotor';
  g.add(tr2);

  // Vertical tail fin
  const fin = new THREE.Mesh(new THREE.BoxGeometry(1.5*S, 18*S, 12*S), bodyMat);
  fin.position.set(0, 9*S, -67*S);
  fin.castShadow = true;
  g.add(fin);

  // Rotor mast
  const mast = new THREE.Mesh(
    new THREE.CylinderGeometry(2*S, 2*S, 12*S, 6),
    new THREE.MeshPhongMaterial({ color: 0x555555 })
  );
  mast.position.y = 14*S;
  g.add(mast);

  // Main rotor blades (65 units span)
  const bladeMat = new THREE.MeshPhongMaterial({ color: 0x555555 });
  const b1 = new THREE.Mesh(new THREE.BoxGeometry(2*S, 1*S, 65*S), bladeMat);
  b1.position.y = 20*S; b1.name = 'mainRotor';
  g.add(b1);
  const b2 = new THREE.Mesh(new THREE.BoxGeometry(65*S, 1*S, 2*S), bladeMat);
  b2.position.y = 20*S; b2.name = 'mainRotor';
  g.add(b2);

  // Cockpit
  const cockpit = new THREE.Mesh(
    new THREE.SphereGeometry(9*S, 8, 6, 0, Math.PI*2, 0, Math.PI/2),
    new THREE.MeshPhongMaterial({ color: 0x88ddff, transparent: true, opacity: 0.5 })
  );
  cockpit.position.set(0, 7*S, 22*S);
  g.add(cockpit);

  // Landing skids
  const skidMat = new THREE.MeshPhongMaterial({ color: 0x444444 });
  [-12, 12].forEach(xOff => {
    const skid = new THREE.Mesh(new THREE.CylinderGeometry(1*S, 1*S, 55*S, 4), skidMat);
    skid.rotation.x = Math.PI/2;
    skid.position.set(xOff*S, -18*S, 0);
    g.add(skid);
  });

  return g;
}

function createAircraftModel(type, isEnemy) {
  const mainColor = isEnemy ? 0xcc4444 : PLANES[type].color;
  const accentCol = isEnemy ? 0xee8844 : PLANES[type].accentColor;
  const tipColor = isEnemy ? 0xff2222 : 0xff6644;
  let model;
  if (type === 'fighter') model = createFighterModel(mainColor, accentCol, tipColor);
  else if (type === 'propeller') model = createPropellerModel(mainColor, accentCol, tipColor);
  else model = createHelicopterModel(mainColor, accentCol, tipColor);
  return model;
}

// --- TERRAIN ---
function createTerrain() {
  const size = 3000, seg = 80;
  const geo = new THREE.PlaneGeometry(size, size, seg, seg);
  geo.rotateX(-Math.PI/2);
  const pos = geo.attributes.position;
  const cols = [];
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), z = pos.getZ(i);
    let y = getTerrainHeight(x, z);
    pos.setY(i, y);
    const green = 0.25 + Math.random()*0.1;
    cols.push(0.15+Math.random()*0.05, green, 0.08+Math.random()*0.03);
  }
  geo.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
  geo.computeVertexNormals();
  const terrain = new THREE.Mesh(geo, new THREE.MeshPhongMaterial({ vertexColors: true, flatShading: true }));
  terrain.receiveShadow = true;
  scene.add(terrain);

  // Water plane
  const water = new THREE.Mesh(
    new THREE.PlaneGeometry(6000, 6000).rotateX(-Math.PI/2),
    new THREE.MeshPhongMaterial({ color: 0x2266aa, transparent: true, opacity: 0.4, flatShading: true })
  );
  water.position.y = -5;
  scene.add(water);

  // Trees
  for (let i = 0; i < 200; i++) {
    const tg = new THREE.Group();
    const trunk = new THREE.Mesh(
      new THREE.CylinderGeometry(1, 1.5, 8, 5),
      new THREE.MeshPhongMaterial({ color: 0x553311, flatShading: true })
    );
    trunk.position.y = 4; trunk.castShadow = true;
    tg.add(trunk);
    const leaves = new THREE.Mesh(
      new THREE.ConeGeometry(5, 12, 6),
      new THREE.MeshPhongMaterial({ color: 0x226622, flatShading: true })
    );
    leaves.position.y = 14; leaves.castShadow = true;
    tg.add(leaves);
    tg.position.set((Math.random()-0.5)*2500, 0, (Math.random()-0.5)*2500);
    scene.add(tg);
  }

  // Mountains
  [[200,100,100,120],[-400,-300,80,90],[500,-400,120,140]].forEach(function(args) {
    const x = args[0], z = args[1], r = args[2], h = args[3];
    const m = new THREE.Mesh(
      new THREE.ConeGeometry(r, h, 7),
      new THREE.MeshPhongMaterial({ color: 0x556655, flatShading: true })
    );
    m.position.set(x, h/2-10, z); m.castShadow = true;
    scene.add(m);
    const s = new THREE.Mesh(
      new THREE.ConeGeometry(r*0.3, h*0.15, 7),
      new THREE.MeshPhongMaterial({ color: 0xeeeeff, flatShading: true })
    );
    s.position.set(x, h-15, z);
    scene.add(s);
  });
}

// --- CLOUDS ---
function createClouds() {
  for (let i = 0; i < 40; i++) {
    const cloud = new THREE.Group();
    for (let j = 0; j < 3 + Math.floor(Math.random()*5); j++) {
      const puff = new THREE.Mesh(
        new THREE.SphereGeometry(10 + Math.random()*20, 7, 5),
        new THREE.MeshPhongMaterial({ color: 0xffffff, transparent: true, opacity: 0.7, flatShading: true })
      );
      puff.position.set((Math.random()-0.5)*30, (Math.random()-0.5)*8, (Math.random()-0.5)*20);
      puff.scale.y = 0.4;
      cloud.add(puff);
    }
    cloud.position.set((Math.random()-0.5)*2000, 150+Math.random()*200, (Math.random()-0.5)*2000);
    cloud.userData.speed = 0.2 + Math.random()*0.3;
    scene.add(cloud);
    cloudObjects.push(cloud);
  }
}

// --- VISIBLE BULLET TRAIL (ammunition trace) ---
function createBulletTrail(from, to, isEnemy) {
  const dir = new THREE.Vector3().subVectors(to, from);
  const len = dir.length();
  const trail = new THREE.Mesh(
    new THREE.CylinderGeometry(0.5, 0.5, len, 4).rotateX(Math.PI/2),
    new THREE.MeshBasicMaterial({ color: isEnemy ? 0xff4444 : 0xffff44 })
  );
  trail.position.copy(from).add(dir.clone().multiplyScalar(0.5));
  trail.lookAt(to);
  scene.add(trail);

  // Glow
  const glow = new THREE.Mesh(
    new THREE.CylinderGeometry(2, 2, len, 4).rotateX(Math.PI/2),
    new THREE.MeshBasicMaterial({ color: isEnemy ? 0xff6644 : 0xffff88, transparent: true, opacity: 0.3 })
  );
  glow.position.copy(trail.position);
  glow.rotation.copy(trail.rotation);
  scene.add(glow);

  bullets.push({ mesh: trail, glowMesh: glow, dir: dir.clone().normalize(), speed: 25, life: 3 });
}

// --- ENEMY BULLET ---
function createEnemyBullet(from, to) {
  const dir = new THREE.Vector3().subVectors(to, from);
  const len = dir.length();
  const trail = new THREE.Mesh(
    new THREE.CylinderGeometry(0.8, 0.8, len, 4).rotateX(Math.PI/2),
    new THREE.MeshBasicMaterial({ color: 0xff3333 })
  );
  trail.position.copy(from).add(dir.clone().multiplyScalar(0.5));
  trail.lookAt(to);
  scene.add(trail);

  const glow = new THREE.Mesh(
    new THREE.CylinderGeometry(3, 3, len, 4).rotateX(Math.PI/2),
    new THREE.MeshBasicMaterial({ color: 0xff4444, transparent: true, opacity: 0.3 })
  );
  glow.position.copy(trail.position);
  glow.rotation.copy(trail.rotation);
  scene.add(glow);

  enemyBullets.push({ mesh: trail, glowMesh: glow, dir: dir.clone().normalize(), speed: 18, life: 4, damage: 5 + level });
}

// --- EXPLOSION ---
function createExplosion(position, size) {
  const group = new THREE.Group();
  group.position.copy(position);
  const ball = new THREE.Mesh(new THREE.SphereGeometry(size, 8, 6), new THREE.MeshBasicMaterial({ color: 0xff8800, transparent: true, opacity: 1 }));
  const inner = new THREE.Mesh(new THREE.SphereGeometry(size*0.6, 6, 5), new THREE.MeshBasicMaterial({ color: 0xffff44, transparent: true, opacity: 1 }));
  const smoke = new THREE.Mesh(new THREE.SphereGeometry(size*1.5, 6, 5), new THREE.MeshBasicMaterial({ color: 0x333333, transparent: true, opacity: 0.6 }));
  group.add(ball, inner, smoke);
  scene.add(group);
  explosions.push({ group: group, ball: ball, inner: inner, smoke: smoke, time: 0, maxTime: 1.5, size: size });

  // Debris particles
  for (let i = 0; i < 15; i++) {
    const p = new THREE.Mesh(
      new THREE.BoxGeometry(1, 1, 1),
      new THREE.MeshBasicMaterial({ color: Math.random()>0.5 ? 0xff6600 : 0xffaa00 })
    );
    p.position.copy(position);
    scene.add(p);
    particles.push({
      mesh: p,
      vel: new THREE.Vector3((Math.random()-0.5)*30, Math.random()*25, (Math.random()-0.5)*30),
      life: 1 + Math.random()
    });
  }
}

// --- SPAWN ENEMIES ---
function spawnEnemies(count) {
  enemies = [];
  const types = ['fighter', 'propeller', 'helicopter'];
  for (let i = 0; i < count; i++) {
    const type = types[Math.floor(Math.random()*types.length)];
    const p = PLANES[type];
    const model = createAircraftModel(type, true);
    const angle = (i/count)*Math.PI*2 + Math.random()*0.5;
    const dist = 200 + Math.random()*400;
    const height = 150 + Math.random()*250;
    const basePos = playerPlane ? playerPlane.position.clone() : new THREE.Vector3(0, 150, 0);
    model.position.set(
      basePos.x + Math.cos(angle)*dist,
      height,
      basePos.z + Math.sin(angle)*dist
    );
    scene.add(model);
    const hpMult = 1 + (level-1)*0.3;
    enemies.push({
      model: model, type: type,
      health: Math.floor(p.maxHealth*hpMult), maxHealth: Math.floor(p.maxHealth*hpMult),
      speed: p.maxSpeed*(0.6+Math.random()*0.3),
      damage: Math.floor(p.damagePerShot*(1+(level-1)*0.15)),
      fireInterval: 1.5,
      fireTimer: Math.random()*p.fireInterval,
      turnTimer: 0,
      targetAngle: { yaw: Math.random()*Math.PI*2, pitch: (Math.random()-0.5)*0.5 },
      boostFuel: 100, id: i
    });
  }
}

// --- PLAYER SETUP ---
function setupPlayer() {
  if (playerPlane) scene.remove(playerPlane);
  playerPlane = createAircraftModel(selectedPlane, false);
  playerPlane.position.set(0, 150, 0);
  scene.add(playerPlane);
  throttle = 0.5;
  fireCooldown = 0;
  const p = PLANES[selectedPlane];
  playerPlane.userData = {
    health: p.maxHealth, maxHealth: p.maxHealth, maxSpeed: p.maxSpeed,
    turnRate: p.turnRate, accel: p.accel, damagePerShot: p.damagePerShot,
    fireInterval: p.fireInterval, type: selectedPlane
  };
}

// --- HUD ---
function updateHUD() {
  const p = playerPlane.userData;
  if (!p) return;
  const hp = Math.max(0, Math.floor(p.health/p.maxHealth*100));
  document.getElementById('hpText').textContent = hp;
  document.getElementById('healthBarInner').style.width = hp+'%';
  document.getElementById('healthBarInner').style.background =
    hp < 30 ? 'linear-gradient(90deg,#ff0000,#ff4444)' :
    hp < 60 ? 'linear-gradient(90deg,#ff8800,#ffcc00)' :
    'linear-gradient(90deg,#44cc44,#88ff44)';
  document.getElementById('enemyCount').textContent = enemies.length;
  document.getElementById('levelNum').textContent = level;
  document.getElementById('scoreDisplay').textContent = score;
}

// --- MINIMAP ---
function updateMinimap() {
  const ctx = minimapCtx;
  ctx.clearRect(0, 0, 160, 160);
  ctx.fillStyle = 'rgba(0,15,30,0.8)';
  ctx.fillRect(0, 0, 160, 160);
  const sc = 0.06, cx = 80, cy = 80;
  const px = playerPlane.position.x, pz = playerPlane.position.z;
  enemies.forEach(function(e) {
    const dx = (e.model.position.x - px)*sc, dz = (e.model.position.z - pz)*sc;
    if (Math.abs(dx)<75 && Math.abs(dz)<75) {
      ctx.fillStyle = '#ff4444';
      ctx.beginPath(); ctx.arc(cx+dx, cy+dz, 3, 0, Math.PI*2); ctx.fill();
    }
  });
  ctx.fillStyle = '#44ff44';
  ctx.beginPath(); ctx.moveTo(cx,cy-5); ctx.lineTo(cx-4,cy+4); ctx.lineTo(cx+4,cy+4); ctx.closePath(); ctx.fill();
}

// --- PLAYER SHOOTING ---
function playerShoot() {
  const p = playerPlane.userData;
  if (fireCooldown > 0) return;
  fireCooldown = p.fireInterval / 60;

  const fwd = new THREE.Vector3(0, 0, -1).applyQuaternion(playerPlane.quaternion);
  const muzzle = playerPlane.position.clone().add(fwd.clone().multiplyScalar(15));
  const target = muzzle.clone().add(fwd.clone().multiplyScalar(400));
  createBulletTrail(muzzle, target, false);
}

// --- ENEMY AI ---
function updateEnemies(dt) {
  for (let idx = 0; idx < enemies.length; idx++) {
    const enemy = enemies[idx];
    const m = enemy.model;
    const fwd = new THREE.Vector3(0, 0, -1).applyQuaternion(m.quaternion);

    enemy.turnTimer -= dt;
    if (enemy.turnTimer <= 0) {
      enemy.turnTimer = 0.5 + Math.random()*1.5;
      if (playerPlane) {
        const dist = m.position.distanceTo(playerPlane.position);
        if (dist < 1200) {
          const toP = new THREE.Vector3().subVectors(playerPlane.position, m.position);
          enemy.targetAngle.yaw = Math.atan2(toP.x, toP.z);
          enemy.targetAngle.pitch = Math.atan2(toP.y, Math.sqrt(toP.x*toP.x+toP.z*toP.z));
        } else {
          const toP = new THREE.Vector3().subVectors(playerPlane.position, m.position);
          enemy.targetAngle.yaw = Math.atan2(toP.x, toP.z);
          enemy.targetAngle.pitch = Math.atan2(toP.y, Math.sqrt(toP.x*toP.x+toP.z*toP.z));
        }
      }
    }

    // Steer toward player
    const toPlayer = new THREE.Vector3().subVectors(playerPlane.position, m.position);
    const curFwd = new THREE.Vector3(0, 0, -1).applyQuaternion(m.quaternion);
    const tgtDir = toPlayer.clone().normalize();
    const curDir = curFwd.clone().normalize();
    const dot = curDir.dot(tgtDir);
    if (dot < 0.97) {
      const cross = new THREE.Vector3().crossVectors(curDir, tgtDir);
      if (cross.length() > 0.01) {
        m.quaternion.multiply(new THREE.Quaternion().setFromAxisAngle(cross.normalize(), (1-dot)*enemy.turnRate*dt*3));
      }
    }

    // Speed
    let spd = 0.7 + throttle*0.3;
    if (enemy.boostFuel > 0 && m.position.distanceTo(playerPlane.position) < 400) {
      spd = 1.2; enemy.boostFuel -= dt*30;
      if (enemy.boostFuel < 0) enemy.boostFuel = 0;
    } else {
      enemy.boostFuel = Math.min(100, enemy.boostFuel+dt*10);
    }
    m.position.add(fwd.clone().multiplyScalar(enemy.speed*spd*dt));

    // Terrain
    const ty = getTerrainHeight(m.position.x, m.position.z) + 30;
    if (m.position.y < ty) m.position.y += dt*30;
    if (m.position.y > 500) m.position.y -= dt*20;

    // Bounds
    if (m.position.length() > 2000) {
      const back = new THREE.Vector3().subVectors(new THREE.Vector3(0,150,0), m.position).normalize();
      m.position.add(back.multiplyScalar(dt*50));
    }

    // Animation
    for (let ci = 0; ci < m.children.length; ci++) {
      const c = m.children[ci];
      if (c.name === 'propeller') c.rotation.z += dt*20;
      if (c.name === 'mainRotor') c.rotation.y += dt*15;
      if (c.name === 'tailRotor') c.rotation.x += dt*20;
    }
    const eng = m.getObjectByName('engineGlow');
    if (eng) { eng.scale.setScalar(0.8+Math.random()*0.4); eng.material.color.setHex(Math.random()>0.5?0x4488ff:0x88aaff); }

    // Shooting
    const distP = m.position.distanceTo(playerPlane.position);
    enemy.fireTimer -= dt;
    if (enemy.fireTimer <= 0 && distP < 700) {
      enemy.fireTimer = enemy.fireInterval;
      const efwd = new THREE.Vector3(0,0,-1).applyQuaternion(m.quaternion);
      const bStart = m.position.clone().add(efwd.clone().multiplyScalar(10));
      const leadPos = playerPlane.position.clone().add(playerVelocity.clone().multiplyScalar(0.5));
      createEnemyBullet(bStart, leadPos);
    }
  }
}

// --- UPDATE BULLETS ---
function updateBullets(dt) {
  for (let i = bullets.length-1; i >= 0; i--) {
    const b = bullets[i];
    b.life -= dt;
    b.mesh.position.add(b.dir.clone().multiplyScalar(b.speed*dt*60));
    b.glowMesh.position.copy(b.mesh.position);
    // Check collision with enemies
    let hit = false;
    for (let e = enemies.length-1; e >= 0; e--) {
      const enemy = enemies[e];
      if (b.mesh.position.distanceTo(enemy.model.position) < 15) {
        enemy.health -= playerPlane.userData.damagePerShot;
        createExplosion(b.mesh.position.clone(), 5);
        hit = true;
        if (enemy.health <= 0) {
          createExplosion(enemy.model.position.clone(), 12);
          scene.remove(enemy.model);
          enemies.splice(e, 1);
          score += 100 * level;
        }
        break;
      }
    }
    if (hit || b.life <= 0) { scene.remove(b.mesh); scene.remove(b.glowMesh); bullets.splice(i,1); }
  }
  for (let i = enemyBullets.length-1; i >= 0; i--) {
    const b = enemyBullets[i];
    b.life -= dt;
    b.mesh.position.add(b.dir.clone().multiplyScalar(b.speed*dt*60));
    b.glowMesh.position.copy(b.mesh.position);
    if (b.life <= 0) { scene.remove(b.mesh); scene.remove(b.glowMesh); enemyBullets.splice(i,1); continue; }
    if (playerPlane && b.mesh.position.distanceTo(playerPlane.position) < 20) {
      playerPlane.userData.health -= b.damage;
      createExplosion(b.mesh.position.clone(), 3);
      scene.remove(b.mesh); scene.remove(b.glowMesh);
      enemyBullets.splice(i,1);
    }
  }
}

// --- UPDATE EFFECTS ---
function updateExplosions(dt) {
  for (let i = explosions.length-1; i >= 0; i--) {
    const e = explosions[i]; e.time += dt;
    const t = e.time/e.maxTime;
    if (t >= 1) { scene.remove(e.group); explosions.splice(i,1); continue; }
    const ex = 1+t*2;
    e.ball.scale.setScalar(ex); e.ball.material.opacity = 1-t;
    e.inner.scale.setScalar(ex*0.8); e.inner.material.opacity = 1-t;
    e.smoke.scale.setScalar(ex*1.5); e.smoke.material.opacity = 0.6*(1-t);
  }
}
function updateParticles(dt) {
  for (let i = particles.length-1; i >= 0; i--) {
    const p = particles[i]; p.life -= dt;
    p.mesh.position.add(p.vel.clone().multiplyScalar(dt));
    p.vel.y -= 15*dt;
    if (p.life <= 0) { scene.remove(p.mesh); particles.splice(i,1); }
  }
}
function updateClouds(dt) {
  for (let i = 0; i < cloudObjects.length; i++) {
    const c = cloudObjects[i];
    c.position.x += c.userData.speed*dt*10;
    if (c.position.x > 1200) c.position.x = -1200;
  }
}

// --- CAMERA (third-person chase) ---
function updateCamera(dt) {
  if (!playerPlane) return;
  const offset = new THREE.Vector3(0, 15, 60);
  offset.applyQuaternion(playerPlane.quaternion);
  const targetPos = playerPlane.position.clone().add(offset);
  camera.position.lerp(targetPos, dt*5);
  const lookAt = playerPlane.position.clone().add(new THREE.Vector3(0,0,-100).applyQuaternion(playerPlane.quaternion));
  camera.lookAt(lookAt);
}

// --- PLAYER UPDATE ---
function updatePlayer(dt) {
  if (!playerPlane || gameOver) return;
  const p = playerPlane.userData;

  // Rate-based steering: mouse offset = turn rate (radians per second)
  // When mouse returns to center, yaw/pitch/roll stop turning (no accumulation)
  const yawRate = mouseX * 1.8;    // radians/sec yaw rate
  const pitchRate = -mouseY * 1.2;  // radians/sec pitch rate
  const rollRate = -mouseY * 0.6;   // radians/sec roll rate

  // Clamp individual axis rates to prevent extreme rotation
  const clampedPitchRate = Math.max(-1.5, Math.min(1.5, pitchRate));
  const clampedRollRate = Math.max(-1.5, Math.min(1.5, rollRate));
  const clampedYawRate = Math.max(-2.0, Math.min(2.0, yawRate));

  // Apply rotation rates directly to the quaternion each frame
  const qYaw = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,1,0), clampedYawRate * dt);
  const qPitch = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1,0,0), clampedPitchRate * dt);
  const qRoll = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,0,1), clampedRollRate * dt);
  const incrementQ = new THREE.Quaternion().multiplyQuaternions(
    new THREE.Quaternion().multiplyQuaternions(qYaw, qPitch), qRoll
  );
  playerPlane.quaternion.multiply(incrementQ);

  // Throttle
  let ar = p.accel;
  if (boostActive) { ar*=2.5; throttle = Math.min(1, throttle+dt*0.5); }
  if (brakeActive) { ar*=-0.5; throttle = Math.max(0, throttle-dt*0.5); }
  throttle = Math.max(0, Math.min(1, throttle+ar*dt*0.3));

  // Move
  const curSpeed = throttle*p.maxSpeed;
  const fwd = new THREE.Vector3(0,0,-1).applyQuaternion(playerPlane.quaternion);
  playerPlane.position.add(fwd.clone().multiplyScalar(curSpeed*dt));
  playerVelocity.copy(fwd).multiplyScalar(curSpeed);

  // Ground collision - instant death
  const ty = getTerrainHeight(playerPlane.position.x, playerPlane.position.z);
  if (playerPlane.position.y <= ty + 5) {
    triggerGameOver();
    return;
  }
  if (playerPlane.position.y > 600) playerPlane.position.y = 600;

  // Bounds
  if (playerPlane.position.length() > 2500) {
    const back = new THREE.Vector3().subVectors(new THREE.Vector3(0,150,0), playerPlane.position).normalize();
    playerPlane.position.add(back.multiplyScalar(dt*100));
  }

  // Engine glow
  const eng = playerPlane.getObjectByName('engineGlow');
  if (eng) { eng.scale.setScalar(0.5+throttle*0.8+Math.random()*0.2); eng.material.color.setHex(throttle>0.8?0x88ccff:0x4488ff); }

  // Propeller/rotor
  for (let ci = 0; ci < playerPlane.children.length; ci++) {
    const c = playerPlane.children[ci];
    if (c.name === 'propeller') c.rotation.z += dt*(5+throttle*15);
    if (c.name === 'mainRotor') c.rotation.y += dt*(3+throttle*8);
    if (c.name === 'tailRotor') c.rotation.x += dt*(8+throttle*12);
  }

  // Fire
  if (fireCooldown > 0) fireCooldown -= dt;
  if (isFiring) playerShoot();

  // Death
  if (p.health <= 0) triggerGameOver();
}

// --- GAME OVER ---
function triggerGameOver() {
  gameOver = true; gameActive = false;
  createExplosion(playerPlane.position.clone(), 15);
  const fallInterval = setInterval(function() {
    if (!playerPlane) { clearInterval(fallInterval); return; }
    playerPlane.rotation.x += 0.1;
    playerPlane.rotation.z += 0.05;
    playerPlane.position.y -= 5;
    playerPlane.position.x += (Math.random()-0.5)*4;
    playerPlane.position.z += (Math.random()-0.5)*4;
    if (playerPlane.position.y < -10) {
      clearInterval(fallInterval);
      setTimeout(function() {
        document.getElementById('gameOverScreen').style.display = 'flex';
        setTimeout(resetToStart, 2000);
      }, 500);
    }
  }, 16);
}

function resetToStart() {
  document.getElementById('gameOverScreen').style.display = 'none';
  document.getElementById('hud').style.display = 'none';
  document.getElementById('minimap').style.display = 'none';
  document.getElementById('controls-hint').style.display = 'none';
  document.getElementById('startScreen').style.display = 'flex';
  level = 1; score = 0; gameOver = false;
  if (playerPlane) { scene.remove(playerPlane); playerPlane = null; }
  enemies.forEach(function(e) { scene.remove(e.model); });
  enemies = [];
  bullets.forEach(function(b) { scene.remove(b.mesh); scene.remove(b.glowMesh); }); bullets = [];
  enemyBullets.forEach(function(b) { scene.remove(b.mesh); scene.remove(b.glowMesh); }); enemyBullets = [];
  explosions.forEach(function(e) { scene.remove(e.group); }); explosions = [];
  particles.forEach(function(p) { scene.remove(p.mesh); }); particles = [];
  terrainHeights = {};
  scene.background.set(0x87CEEB); scene.fog.color.set(0x87CEEB);
}

// --- VICTORY ---
function showVictory() {
  gameActive = false; level++;
  const vs = document.getElementById('victoryScreen');
  document.getElementById('victoryMsg').textContent = 'Level '+level+' incoming...';
  vs.style.display = 'flex';
  setTimeout(function() { vs.style.display = 'none'; startLevel(); }, 2500);
}

// --- START LEVEL ---
function startLevel() {
  gameActive = true; gameOver = false;
  const enemyCount = Math.min(3+level, 12);
  setupPlayer();
  spawnEnemies(enemyCount);
  document.getElementById('hud').style.display = 'block';
  document.getElementById('minimap').style.display = 'block';
  document.getElementById('controls-hint').style.display = 'block';
  document.getElementById('startScreen').style.display = 'none';
  const ld = document.getElementById('levelDisplay');
  ld.textContent = 'WAVE '+level; ld.style.display = 'block';
  setTimeout(function() { ld.style.display = 'none'; }, 2000);
  scene.background.set(0x87CEEB); scene.fog.color.set(0x87CEEB);
}

// --- INPUT ---
function setupInput() {
  document.addEventListener('mousemove', function(e) {
    mouseX = (e.clientX/window.innerWidth-0.5)*2;
    mouseY = (e.clientY/window.innerHeight-0.5)*2;
  });
  document.addEventListener('mousedown', function(e) { if (e.button===0) isFiring = true; });
  document.addEventListener('mouseup', function(e) { if (e.button===0) isFiring = false; });
  document.addEventListener('keydown', function(e) {
    if (e.code==='Space') boostActive = true;
    if (e.code==='ShiftLeft'||e.code==='ShiftRight') brakeActive = true;
  });
  document.addEventListener('keyup', function(e) {
    if (e.code==='Space') boostActive = false;
    if (e.code==='ShiftLeft'||e.code==='ShiftRight') brakeActive = false;
  });
  document.addEventListener('wheel', function(e) {
    throttle -= e.deltaY*0.001;
    throttle = Math.max(0, Math.min(1, throttle));
  });
  document.getElementById('startBtn').addEventListener('click', function() {
    if (selectedPlane) startLevel();
  });
  document.addEventListener('contextmenu', function(e) { e.preventDefault(); });
}

// --- GAME LOOP ---
function gameLoop() {
  requestAnimationFrame(gameLoop);
  const dt = Math.min(clock.getDelta(), 0.05);

  if (gameActive && !gameOver) {
    updatePlayer(dt);
    updateEnemies(dt);
    updateBullets(dt);
    updateCamera(dt);
    updateHUD();
    updateMinimap();
    if (enemies.length === 0) showVictory();
  }

  if (!gameOver) {
    updateExplosions(dt);
    updateParticles(dt);
    updateClouds(dt);
  }

  renderer.render(scene, camera);
}

// --- INIT ---
function init() {
  buildStartScreen();
  initThree();
  createTerrain();
  createClouds();
  setupInput();

  // Create a dummy player for background rendering on start screen
  playerPlane = createAircraftModel('fighter', false);
  playerPlane.position.set(0, 150, 0);
  scene.add(playerPlane);

  gameLoop();
}

init();
</script>
